<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f4eedf"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceabb"/>
      <stop offset="30%" stop-color="#f8b500"/>
      <stop offset="70%" stop-color="#dd9600"/>
      <stop offset="100%" stop-color="#9b6200"/>
    </linearGradient>
    <linearGradient id="innerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4600"/>
      <stop offset="50%" stop-color="#4a2a00"/>
      <stop offset="100%" stop-color="#2d1900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#734900" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="190" fill="url(#goldGrad)" />
    <!-- Inner Coin Base -->
    <circle cx="256" cy="256" r="162" fill="url(#innerGold)" stroke="url(#goldGrad)" stroke-width="10" />
    <!-- Stylized A & Growth Arrow emblem -->
    <path d="M 256 125 L 340 330 L 305 330 L 256 200 L 207 330 L 172 330 Z" fill="url(#goldGrad)" />
    <!-- Growth Arrow overlay -->
    <path d="M 195 305 L 245 255 L 280 290 L 375 195 M 345 195 L 375 195 L 375 225" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

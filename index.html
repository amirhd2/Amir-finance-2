    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            user-select: none;

        .glass-header {

        /* Card Stack Animation Styles */
        .card-stack-container {
            height: 60vh;
            max-height: 480px;
            position: relative;
            perspective: 1000px;
        }

        .stack-card {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, box-shadow 0.3s ease;
            transform-origin: center bottom;
            will-change: transform, opacity;
        }

        /* Position 0: Active top card */
        .stack-card[data-depth="0"] {
            transform: translateY(0) scale(1);
            z-index: 30;
            opacity: 1;
            box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.08);
        }

        /* Position 1: Second card stacked behind */
        .stack-card[data-depth="1"] {
            transform: translateY(14px) scale(0.95);
            z-index: 20;
            opacity: 0.92;
            pointer-events: none;
        }

        /* Position 2: Third card stacked deep behind */
        .stack-card[data-depth="2"] {
            transform: translateY(28px) scale(0.90);
            z-index: 10;
            opacity: 0.75;
            pointer-events: none;
        }

        /* Hidden cards further back */
        .stack-card[data-depth="hidden"] {
            transform: translateY(40px) scale(0.85);
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Swiping out animation */
        .stack-card.card-exit-to-back {
            animation: moveCardToBack 0.45s ease-in-out forwards;
        }

        .stack-card.card-enter-from-back {
            animation: moveCardFromBack 0.45s ease-in-out forwards;
        }

        @keyframes moveCardToBack {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
                z-index: 35;
            }
            40% {
                transform: translateY(-70px) scale(0.96) rotate(-3deg);
                opacity: 0.8;
                z-index: 35;
            }
            100% {
                transform: translateY(30px) scale(0.88) rotate(0deg);
                opacity: 0.5;
                z-index: 5;
            }
        }

        @keyframes moveCardFromBack {
            0% {
                transform: translateY(-70px) scale(0.96) rotate(3deg);
                opacity: 0.8;
                z-index: 35;
            }
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
                z-index: 30;
            }
        }

        /* iOS Wheel Picker Styles */
        .ios-wheel-container {
            height: 200px;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;

        .ios-wheel-container::-webkit-scrollbar {
            display: none;
        }
        .ios-wheel-item {
            height: 40px;
            scroll-snap-align: center;
            scroll-snap-stop: normal;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            will-change: transform, opacity;
        }
        .ios-wheel-highlight {
            position: absolute;
            top: 80px;
            left: 4px;
            right: 4px;
            height: 40px;
            background: rgba(99, 102, 241, 0.08);
            border-top: 1px solid rgba(99, 102, 241, 0.25);
            border-bottom: 1px solid rgba(99, 102, 241, 0.25);
            pointer-events: none;
            border-radius: 12px;
            z-index: 10;
        }
        .dark .ios-wheel-highlight {
            background: rgba(129, 140, 248, 0.12);
            border-top: 1px solid rgba(129, 140, 248, 0.3);
            border-bottom: 1px solid rgba(129, 140, 248, 0.3);
        }

        /* Native iOS Smooth Animations */
        @keyframes iosSheetIn {
            0% {
                transform: translateY(100%) scale(0.96);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes iosSheetOut {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100%) scale(0.96);
                opacity: 0;
            }
        }

        @keyframes iosFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes iosFadeOut {
            0% {
                opacity: 1;
            }

        @keyframes iosStaggerUp {
            0% {

                transform: translateY(0) scale(1);

        @keyframes fadeIn {

        @keyframes slideUp {
            from { transform: translateY(24px) scale(0.97); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }

        @keyframes scaleUp {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }

        .animate-ios-sheet-in {
            animation: iosSheetIn 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: transform, opacity;

        .animate-ios-sheet-out {

        .animate-ios-fade-in {

        .animate-ios-fade-out {

        .animate-slide-up {

        .animate-scale-up {

        .ios-stagger-1 { animation: iosStaggerUp 400ms cubic-bezier(0.16, 1, 0.3, 1) 20ms both; }
        .ios-stagger-2 { animation: iosStaggerUp 400ms cubic-bezier(0.16, 1, 0.3, 1) 40ms both; }

        .ios-stagger-5 { animation: iosStaggerUp 400ms cubic-bezier(0.16, 1, 0.3, 1) 100ms both; }

    </style>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- Main Mobile Frame Container -->
    <div id="root" class="w-full sm:max-w-[430px] h-[100vh] sm:h-[880px] bg-slate-50 dark:bg-slate-950 sm:rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const avatarColors = [
            'bg-blue-600', 'bg-amber-600', 'bg-emerald-600', 'bg-indigo-600', 'bg-teal-600',
            'bg-rose-600', 'bg-purple-600', 'bg-cyan-600', 'bg-orange-600', 'bg-violet-600'
        ];

        const getAvatarColor = (id, name) => {
            let hash = 0;
            const str = (name || '') + id;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarColors[Math.abs(hash) % avatarColors.length];
        };

        const jalaliMonths = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

        const gregorianToJalali = (gy, gm, gd) => {
            const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            gy -= (gy <= 1600) ? 621 : 1600;
            const gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) + (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * Math.floor(days / 12053);
            days %= 12053;
            jy += 4 * Math.floor(days / 1461);
            days %= 1461;
            jy += Math.floor((days - 1) / 365);
            if (days > 0) days = (days - 1) % 365;
            const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
            const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return { jy, jm, jd };
        };

        const getDeviceJalaliDate = () => {
            try {
                const now = new Date();
                const gy = now.getFullYear();
                const gm = now.getMonth() + 1;
                const gd = now.getDate();
                const { jy, jm, jd } = gregorianToJalali(gy, gm, gd);
                return {
                    day: jd,
                    month: jalaliMonths[jm - 1] || 'مرداد',
                    year: jy
                };
            } catch (e) {
                return { day: 3, month: 'مرداد', year: 1405 };
            }
        };

        const jalaliToGregorian = (jy, jm, jd) => {
            let gy = (jy <= 979) ? 621 : 1600;
            jy -= (jy <= 979) ? 0 : 979;
            let days = (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
            gy += 400 * Math.floor(days / 146097);
            days %= 146097;
            if (days > 36524) {
                gy += 100 * Math.floor(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }
            gy += 4 * Math.floor(days / 1461);
            days %= 1461;
            if (days > 365) {
                gy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }
            const g_d_m = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let gm = 0;
            while (days >= g_d_m[gm]) {
                days -= g_d_m[gm];
                gm++;
            }
            return { gy, gm, gd: days + 1 };
        };

        const getDaysDiffFromToday = (jy, jm, jd) => {
            const todayJ = getDeviceJalaliDate();
            const todayMIdx = jalaliMonths.indexOf(todayJ.month) + 1;
            const gToday = jalaliToGregorian(todayJ.year, todayMIdx > 0 ? todayMIdx : 1, todayJ.day);
            const gTarget = jalaliToGregorian(jy, jm, jd);
            
            const dToday = new Date(gToday.gy, gToday.gm - 1, gToday.gd);
            const dTarget = new Date(gTarget.gy, gTarget.gm - 1, gTarget.gd);
            
            const diffTime = dTarget.getTime() - dToday.getTime();
            return Math.round(diffTime / (1000 * 60 * 60 * 24));
        };

        const parseJalaliDateStr = (dateStr) => {
            const defaultDate = getDeviceJalaliDate();
            if (!dateStr || typeof dateStr !== 'string') return defaultDate;

            try {
                const cleanStr = dateStr.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
                const parts = cleanStr.split(/[\s/.-]+/);
                if (parts.length >= 3) {
                    let p0 = parseInt(parts[0], 10);
                    let p1 = parts[1];
                    let p2 = parseInt(parts[2], 10);

                    let year, month, day;

                    if (p0 > 1300) {
                        year = p0;
                        month = p1;
                        day = p2;
                    } else if (p2 > 1300) {
                        day = p0;
                        month = p1;
                        year = p2;
                    } else {
                        year = defaultDate.year;
                        month = p1;
                        day = p0 || defaultDate.day;
                    }

                    if (!isNaN(parseInt(month, 10))) {
                        const mNum = parseInt(month, 10);
                        if (mNum >= 1 && mNum <= 12) {
                            month = jalaliMonths[mNum - 1];
                        }
                    }

                    if (!day || isNaN(day)) day = defaultDate.day;
                    if (!month || !jalaliMonths.includes(month)) month = defaultDate.month;
                    if (!year || isNaN(year)) year = defaultDate.year;

                    return { day, month, year };
                }
            } catch (e) {
                console.error("Error parsing Jalali date:", e);
            }
            return defaultDate;
        };

        const formatDateToNumericJalali = (dateStr) => {
            if (!dateStr || dateStr === '-' || dateStr === 'نامشخص') return '-';
            if (dateStr === 'امروز') {
                const today = getDeviceJalaliDate();
                const m = String(jalaliMonths.indexOf(today.month) + 1).padStart(2, '0');
                const d = String(today.day).padStart(2, '0');
                return `${today.year}/${m}/${d}`;
            }
            const parsed = parseJalaliDateStr(dateStr);
            if (!parsed || !parsed.year) return dateStr;

            let monthNum = 1;
            if (typeof parsed.month === 'string' && jalaliMonths.includes(parsed.month)) {
                monthNum = jalaliMonths.indexOf(parsed.month) + 1;
            } else {
                monthNum = parseInt(parsed.month, 10) || 1;
            }

            const y = String(parsed.year);
            const m = String(monthNum).padStart(2, '0');
            const d = String(parsed.day).padStart(2, '0');

            return `${y}/${m}/${d}`;
        };

        const parseRawNumber = (val) => {
            if (val === null || val === undefined) return '';
            return String(val).replace(/\D/g, '');
        };

        const formatWithCommas = (val) => {
            if (val === null || val === undefined || val === '') return '';
            const clean = String(val).replace(/\D/g, '');
            if (!clean) return '';
            return Number(clean).toLocaleString('en-US');
        };

        const numToPersianWords = (num) => {
            if (num === null || num === undefined || num === '') return '';
            const n = Math.abs(Number(num));
            if (isNaN(n) || n === 0) return '';

            const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
            const dahna = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هیجده', 'نوزده'];
            const dahgan = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
            const sadgan = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
            const maghadir = ['', 'هزار', 'میلیون', 'میلیارد', 'تریلیون'];

            const threeDigitsToWords = (number) => {
                let sad = Math.floor(number / 100);
                let dah = Math.floor((number % 100) / 10);
                let yek = number % 10;
                let parts = [];

                if (sad > 0) parts.push(sadgan[sad]);

                if (dah === 1) {
                    parts.push(dahna[yek]);
                } else {
                    if (dah > 1) parts.push(dahgan[dah]);
                    if (yek > 0) parts.push(yekan[yek]);
                }

                return parts.join(' و ');
            };

            let splitted = [];
            let temp = Math.floor(n);
            while (temp > 0) {
                splitted.push(temp % 1000);
                temp = Math.floor(temp / 1000);
            }

            let resultParts = [];
            for (let i = splitted.length - 1; i >= 0; i--) {
                const val = splitted[i];
                if (val > 0) {
                    const word = threeDigitsToWords(val);
                    const unit = maghadir[i];
                    resultParts.push(word + (unit ? ' ' + unit : ''));
                }
            }

            return resultParts.join(' و ') + ' تومان';
        };

        const getLoanNextDueInfo = (loan, txList) => {
            if (!loan) return { nextDueNum: 1, nextDueDateStr: 'نامشخص', daysLeft: 0, totalInst: 12, paidInst: 0, remainingInst: 12, isCompleted: false };

            const instAmt = Number(loan.installmentAmount) || 0;
            const totalRepay = Number(loan.totalRepayment) || Number(loan.principalAmount) || 0;
            const totalInst = (loan.totalInstallments && loan.totalInstallments > 0)
                ? loan.totalInstallments
                : (instAmt > 0 && totalRepay > 0 ? Math.ceil(totalRepay / instAmt) : 12);

            const loanTxs = (txList || []).filter(t => t.loanId === loan.id && t.type === 'repayment');
            const paidInst = loanTxs.length;
            const remainingInst = Math.max(0, totalInst - paidInst);

            if (remainingInst <= 0) {
                return {
                    nextDueNum: totalInst,
                    nextDueDateStr: 'کلیه اقساط پرداخت شده‌اند',
                    daysLeft: 0,
                    totalInst,
                    paidInst,
                    remainingInst: 0,
                    isCompleted: true
                };
            }

            const nextDueNum = paidInst + 1;

            let startYear, startMonthIdx, startDay;
            if (loan.startDate) {
                const parsedStart = parseJalaliDateStr(loan.startDate);
                startYear = parsedStart.year;
                startMonthIdx = jalaliMonths.indexOf(parsedStart.month);
                if (startMonthIdx === -1) startMonthIdx = 0;
                startDay = parsedStart.day;
            } else {
                const todayJ = getDeviceJalaliDate();
                startYear = todayJ.year;
                startMonthIdx = jalaliMonths.indexOf(todayJ.month);
                if (startMonthIdx === -1) startMonthIdx = 0;
                startDay = todayJ.day;
            }

            const dueDay = loan.dueDayOfMonth || startDay || 25;

            let firstDueMonthIdx = startMonthIdx;
            let firstDueYear = startYear;
            if (dueDay <= startDay) {
                firstDueMonthIdx += 1;
                if (firstDueMonthIdx >= 12) {
                    firstDueMonthIdx = 0;
                    firstDueYear += 1;
                }
            }

            const monthsToAdd = nextDueNum - 1;
            let targetMonthIdx = firstDueMonthIdx + monthsToAdd;
            let targetYear = firstDueYear + Math.floor(targetMonthIdx / 12);
            targetMonthIdx = targetMonthIdx % 12;

            const targetMonthName = jalaliMonths[targetMonthIdx];

            let maxDaysInMonth = 30;
            if (targetMonthIdx < 6) maxDaysInMonth = 31;
            else if (targetMonthIdx === 11) maxDaysInMonth = 29;

            const targetDay = Math.min(dueDay, maxDaysInMonth);

                    return;
                }
            } catch (e) {}
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);

        function PullToRefresh({ onRefresh, children, className = "" }) {
            const containerRef = useRef(null);
            const [pullY, setPullY] = useState(0);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const touchStartRef = useRef({ x: 0, y: 0 });
            const isPullingRef = useRef(false);

            const PULL_THRESHOLD = 52;

            const handleTouchStart = (e) => {
                const container = containerRef.current;
                if (!container || isRefreshing) return;

                if (container.scrollTop <= 0) {
                    const touch = e.touches ? e.touches[0] : e;
                    touchStartRef.current = { x: touch.clientX, y: touch.clientY };
                    isPullingRef.current = true;
                } else {
                    isPullingRef.current = false;
                }
            };

            const handleTouchMove = (e) => {
                if (!isPullingRef.current || isRefreshing) return;
                const container = containerRef.current;
                if (!container) return;

                const touch = e.touches ? e.touches[0] : e;
                const deltaY = touch.clientY - touchStartRef.current.y;
                const deltaX = Math.abs(touch.clientX - touchStartRef.current.x);

                if (deltaY > 0 && deltaY > deltaX && container.scrollTop <= 0) {
                    const damped = Math.min(80, Math.pow(deltaY, 0.82) * 0.72);
                    setPullY(damped);

                    if (e.cancelable && deltaY > 10) {
                        e.preventDefault();
                    }
                } else if (deltaY <= 0) {
                    setPullY(0);
                    isPullingRef.current = false;
                }
            };

            const handleTouchEnd = async () => {
                if (!isPullingRef.current && !isRefreshing) return;
                isPullingRef.current = false;

                if (pullY >= PULL_THRESHOLD) {
                    setIsRefreshing(true);
                    setPullY(48);
                    try {
                        if (onRefresh) {
                            await Promise.resolve(onRefresh());
                        }
                        await new Promise(r => setTimeout(r, 450));
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setIsRefreshing(false);
                        setPullY(0);
                    }
                } else {
                    setPullY(0);
                }
            };

            const progress = Math.min(1, pullY / PULL_THRESHOLD);
            const rotation = progress * 320;
            const scale = isRefreshing ? 1 : Math.min(1, Math.max(0, (progress - 0.1) / 0.9));

            return (
                <div 
                    ref={containerRef}
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}
                    onTouchCancel={handleTouchEnd}
                    className={`relative overflow-y-auto hide-scrollbar overscroll-y-contain ${className}`}
                    style={{ WebkitOverflowScrolling: 'touch' }}
                >
                    {/* Floating Google Material Refresh Card Indicator */}
                    {(pullY > 0 || isRefreshing) && (
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 z-40 pointer-events-none"
                            style={{
                                top: '8px',
                                transform: `translate3d(-50%, ${pullY}px, 0) scale(${scale})`,
                                opacity: isRefreshing ? 1 : Math.min(1, pullY / 15),
                                transition: isPullingRef.current ? 'none' : 'transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 200ms ease'
                            }}
                        >
                            <div className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200/80 dark:border-slate-700 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                                {isRefreshing ? (
                                    <div className="w-5 h-5 border-2 border-indigo-600 dark:border-indigo-400 border-t-transparent rounded-full animate-spin shrink-0" />
                                ) : (
                                    <div 
                                        className="transition-transform duration-75 flex items-center justify-center"
                                        style={{ transform: `rotate(${rotation}deg)` }}
                                    >

                        className="w-full min-h-full"
                        style={{
                            transform: pullY > 0 ? `translate3d(0, ${pullY * 0.35}px, 0)` : 'none',
                            transition: isPullingRef.current ? 'none' : 'transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1)'
                        }}
                    >
                        {children}
                    </div>

        function SwipeBackWrapper({ onBack, enabled = true, children, className = "" }) {
            const [translateX, setTranslateX] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const startXRef = useRef(0);
            const startYRef = useRef(0);
            const isEdgeSwipeRef = useRef(false);
            const containerRef = useRef(null);
            const containerWidthRef = useRef(360);

            const handleStart = (clientX, clientY) => {
                if (!enabled || !onBack) return;
                const container = containerRef.current;
                if (!container) return;
                
                const rect = container.getBoundingClientRect();
                containerWidthRef.current = rect.width || window.innerWidth || 360;
                const relativeX = clientX - rect.left;

                // Trigger if gesture starts within 64px from left edge of container
                if (relativeX >= -10 && relativeX <= 64) {
                    startXRef.current = clientX;
                    startYRef.current = clientY;
                    isEdgeSwipeRef.current = true;
                    setIsDragging(true);
                }
            };

            const handleMove = (clientX, clientY, e) => {
                if (!isEdgeSwipeRef.current || !enabled) return;

                const deltaX = clientX - startXRef.current;
                const deltaY = Math.abs(clientY - startYRef.current);

                // If primary motion is horizontal to the right
                if (deltaX > 0 && deltaX > deltaY) {
                    setTranslateX(deltaX);
                    if (e && e.cancelable) {
                        e.preventDefault();
                    }
                } else if (deltaX <= 0) {
                    setTranslateX(0);
                }
            };

            const handleEnd = () => {
                if (!isEdgeSwipeRef.current || !enabled) return;
                isEdgeSwipeRef.current = false;
                setIsDragging(false);

                const width = containerWidthRef.current;
                const threshold = Math.min(100, width * 0.25);

                if (translateX >= threshold) {
                    setTranslateX(width);
                    setTimeout(() => {
                        setTranslateX(0);
                        if (onBack) onBack();
                    }, 220);
                } else {
                    setTranslateX(0);
                }
            };

            useEffect(() => {
                const onWindowPointerMove = (e) => {
                    if (isEdgeSwipeRef.current) {
                        handleMove(e.clientX, e.clientY, e);
                    }
                };

                const onWindowPointerUp = () => {
                    if (isEdgeSwipeRef.current) {
                        handleEnd();
                    }
                };

                const onWindowTouchMove = (e) => {
                    if (isEdgeSwipeRef.current && e.touches && e.touches[0]) {
                        handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
                    }
                };

                const onWindowTouchEnd = () => {
                    if (isEdgeSwipeRef.current) {
                        handleEnd();
                    }
                };

                window.addEventListener('pointermove', onWindowPointerMove, { passive: false });
                window.addEventListener('pointerup', onWindowPointerUp);
                window.addEventListener('pointercancel', onWindowPointerUp);

                window.addEventListener('touchmove', onWindowTouchMove, { passive: false });
                window.addEventListener('touchend', onWindowTouchEnd);
                window.addEventListener('touchcancel', onWindowTouchEnd);

                return () => {
                    window.removeEventListener('pointermove', onWindowPointerMove);
                    window.removeEventListener('pointerup', onWindowPointerUp);
                    window.removeEventListener('pointercancel', onWindowPointerUp);

                    window.removeEventListener('touchmove', onWindowTouchMove);
                    window.removeEventListener('touchend', onWindowTouchEnd);
                    window.removeEventListener('touchcancel', onWindowTouchEnd);
                };
            }, [translateX, enabled, onBack]);

            const onPointerDown = (e) => {
                handleStart(e.clientX, e.clientY);
            };

            const onTouchStart = (e) => {
                if (e.touches && e.touches[0]) {
                    handleStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            };

            const progress = containerWidthRef.current ? Math.min(1, translateX / containerWidthRef.current) : 0;

            return (
                <div 
                    ref={containerRef}
                    onPointerDown={onPointerDown}
                    onTouchStart={onTouchStart}
                    className={`relative w-full min-h-full touch-pan-y ${className}`}
                    style={{
                        transform: translateX > 0 ? `translate3d(${translateX}px, 0, 0)` : 'none',
                        transition: isDragging ? 'none' : 'transform 260ms cubic-bezier(0.16, 1, 0.3, 1)',
                        boxShadow: translateX > 0 ? '-12px 0 32px rgba(0, 0, 0, 0.2)' : 'none',
                        willChange: 'transform'
                    }}
                >
                    {/* Left edge grab target strip to ensure touch/pointer events near left edge are easily caught */}
                    <div 
                        className="absolute top-0 bottom-0 left-0 w-12 z-30 select-none cursor-grab active:cursor-grabbing"
                        style={{ touchAction: 'pan-y' }}
                    />

                    {/* Dark backdrop shadow indicator underneath sliding view */}
                    {translateX > 0 && (
                        <div 
                            className="fixed inset-0 bg-slate-950/40 pointer-events-none z-[-1] transition-opacity duration-200"
                            style={{ opacity: progress * 0.5 }}
                        />
                    )}

                    {children}
                </div>
            );
        }

        function IOSWheelPicker({ items = [], selectedValue, onChange, label }) {
            const containerRef = useRef(null);
            const [scrollTop, setScrollTop] = useState(0);
            const isInteractingRef = useRef(false);
            const animFrameRef = useRef(null);
            const scrollTimeoutRef = useRef(null);

            // Physics dragging refs
            const startYRef = useRef(0);
            const startScrollTopRef = useRef(0);
            const lastYRef = useRef(0);
            const lastTimeRef = useRef(0);
            const velocityRef = useRef(0);

            const itemHeight = 40;

            // Default selection safety check
            useEffect(() => {
                if (items && items.length > 0) {
                    if (selectedValue === undefined || selectedValue === null || items.indexOf(selectedValue) === -1) {
                        const defaultVal = items[0];
                        if (onChange) onChange(defaultVal);
                    }
                }
            }, [items, selectedValue]);

            // Programmatically align scroll position when selectedValue changes externally
            useEffect(() => {
                if (!isInteractingRef.current && containerRef.current && items && items.length > 0) {
                    let idx = items.indexOf(selectedValue);
                    if (idx === -1) idx = 0;
                    const targetScroll = idx * itemHeight;
                    if (Math.abs(containerRef.current.scrollTop - targetScroll) > 1.5) {
                        containerRef.current.scrollTop = targetScroll;
                        setScrollTop(targetScroll);
                    }
                }
            }, [selectedValue, items]);

            // Snap to nearest item and notify onChange
            const snapToNearest = (currentPos) => {
                if (!containerRef.current || !items || items.length === 0) return;
                const maxScroll = (items.length - 1) * itemHeight;
                const clamped = Math.max(0, Math.min(currentPos, maxScroll));
                const index = Math.round(clamped / itemHeight);
                const targetScroll = index * itemHeight;

                if (containerRef.current) {
                    containerRef.current.scrollTo({
                        top: targetScroll,
                        behavior: 'smooth'
                    });
                    setScrollTop(targetScroll);
                }

                if (items[index] !== undefined && items[index] !== selectedValue) {
                    if (onChange) onChange(items[index]);
                }
            };

            // Inertia simulation for touch/mouse release
            const startInertia = (initialVelocity) => {
                if (!containerRef.current) return;
                if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);

                let v = initialVelocity;
                const friction = 0.93; // Smooth iOS momentum decay

                const step = () => {
                    if (!containerRef.current) {
                        isInteractingRef.current = false;
                        return;
                    }

                    v *= friction;

                    if (Math.abs(v) < 0.4) {
                        isInteractingRef.current = false;
                        snapToNearest(containerRef.current.scrollTop);
                        return;
                    }

                    let nextScroll = containerRef.current.scrollTop - v;
                    const maxScroll = (items.length - 1) * itemHeight;

                    if (nextScroll < 0) {
                        nextScroll = 0;
                        v = 0;
                    } else if (nextScroll > maxScroll) {
                        nextScroll = maxScroll;
                        v = 0;
                    }

                    containerRef.current.scrollTop = nextScroll;
                    setScrollTop(nextScroll);

                    animFrameRef.current = requestAnimationFrame(step);
                };

                animFrameRef.current = requestAnimationFrame(step);
            };

            // Touch/Mouse event handlers
            const handleStart = (e) => {
                if (animFrameRef.current) {
                    cancelAnimationFrame(animFrameRef.current);
                    animFrameRef.current = null;
                }
                isInteractingRef.current = true;
                const pageY = e.touches ? e.touches[0].pageY : e.pageY;
                startYRef.current = pageY;
                lastYRef.current = pageY;
                lastTimeRef.current = performance.now();
                startScrollTopRef.current = containerRef.current ? containerRef.current.scrollTop : 0;
                velocityRef.current = 0;
            };

            const handleMove = (e) => {
                if (!isInteractingRef.current || !containerRef.current) return;
                const pageY = e.touches ? e.touches[0].pageY : e.pageY;
                const now = performance.now();
                const deltaY = pageY - startYRef.current;
                const stepDeltaY = pageY - lastYRef.current;
                const dt = now - lastTimeRef.current;

                if (dt > 0) {
                    const currentVelocity = (stepDeltaY / dt) * 16;
                    velocityRef.current = velocityRef.current * 0.3 + currentVelocity * 0.7;
                }

                lastYRef.current = pageY;
                lastTimeRef.current = now;

                const newScroll = startScrollTopRef.current - deltaY;
                containerRef.current.scrollTop = newScroll;
                setScrollTop(newScroll);
            };

            const handleEnd = () => {
                if (!isInteractingRef.current) return;

                const v = velocityRef.current;
                if (Math.abs(v) > 1.2) {
                    startInertia(v);
                } else if (containerRef.current) {
                    isInteractingRef.current = false;
                    snapToNearest(containerRef.current.scrollTop);
                } else {
                    isInteractingRef.current = false;
                }
            };

            const handleScroll = (e) => {
                const currentScroll = e.target.scrollTop;
                setScrollTop(currentScroll);

                // Calculate active item continuously for responsive feedback
                const index = Math.round(currentScroll / itemHeight);
                if (items[index] !== undefined && items[index] !== selectedValue && !isInteractingRef.current) {
                    if (onChange) onChange(items[index]);
                }

                // Debounce snap for trackpad / wheel scroll
                if (!isInteractingRef.current) {
                    clearTimeout(scrollTimeoutRef.current);
                    scrollTimeoutRef.current = setTimeout(() => {
                        const finalIdx = Math.round(currentScroll / itemHeight);
                        if (items[finalIdx] !== undefined && items[finalIdx] !== selectedValue) {
                            if (onChange) onChange(items[finalIdx]);
                        }
                    }, 80);
                }
            };

            return (
                <div className="flex flex-col items-center flex-1 min-w-0 select-none">
                    {label && <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">{label}</span>}
                    <div className="relative w-full h-[200px] overflow-hidden rounded-2xl bg-slate-50/90 dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 shadow-2xs">
                        {/* iOS Center Selection Highlight Bar */}
                        <div className="ios-wheel-highlight"></div>

                        {/* Top and Bottom Cylindrical Lens Fade Gradients */}
                        <div className="absolute inset-x-0 top-0 h-[80px] bg-gradient-to-b from-slate-100 dark:from-slate-900 via-slate-100/75 dark:via-slate-900/75 to-transparent pointer-events-none z-20" />
                        <div className="absolute inset-x-0 bottom-0 h-[80px] bg-gradient-to-t from-slate-100 dark:from-slate-900 via-slate-100/75 dark:via-slate-900/75 to-transparent pointer-events-none z-20" />

                        {/* Scroll Container */}
                        <div 
                            ref={containerRef}
                            onScroll={handleScroll}
                            onTouchStart={handleStart}
                            onTouchMove={handleMove}
                            onTouchEnd={handleEnd}
                            onMouseDown={handleStart}
                            onMouseMove={handleMove}
                            onMouseUp={handleEnd}
                            onMouseLeave={handleEnd}
                            className="ios-wheel-container w-full h-full overflow-y-auto overflow-x-hidden relative cursor-grab active:cursor-grabbing hide-scrollbar"
                            style={{
                                perspective: '350px',
                                perspectiveOrigin: '50% 50%',
                                touchAction: 'none',
                                WebkitOverflowScrolling: 'touch'
                            }}
                        >
                            {/* Top padding spacer: 2 rows (80px) */}
                            <div className="h-[80px] shrink-0 pointer-events-none"></div>

                            {items.map((item, idx) => {
                                const offset = (idx * itemHeight - scrollTop) / itemHeight;
                                const absOffset = Math.abs(offset);

                                // 3D Cylindrical Perspective Math for 5 rows
                                const rotateX = Math.max(-60, Math.min(60, offset * -25));
                                const scale = Math.max(0.7, 1 - absOffset * 0.12);

                                let opacity = 0;
                                if (absOffset <= 0.5) opacity = 1;
                                else if (absOffset <= 1.5) opacity = 0.55;
                                else if (absOffset <= 2.5) opacity = 0.22;
                                else opacity = 0.05;

                                const isSelected = item === selectedValue || Math.round(scrollTop / itemHeight) === idx;

                                return (
                                    <div 
                                        key={idx}
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            isInteractingRef.current = false;
                                            snapToNearest(idx * itemHeight);
                                        }}
                                        className="ios-wheel-item flex items-center justify-center w-full h-[40px] cursor-pointer select-none"
                                        style={{
                                            transform: `rotateX(${rotateX}deg) scale(${scale})`,
                                            opacity: opacity,
                                            transformStyle: 'preserve-3d',
                                            willChange: 'transform, opacity'
                                        }}
                                    >
                                        <span className={`font-mono text-center transition-all duration-150 ${
                                            isSelected 
                                                ? 'text-indigo-600 dark:text-indigo-400 text-base font-black scale-105' 
                                                : 'text-slate-700 dark:text-slate-300 text-sm font-semibold'
                                        }`}>
                                            {item}
                                        </span>
                                    </div>
                                );
                            })}

                            {/* Bottom padding spacer: 2 rows (80px) */}
                            <div className="h-[80px] shrink-0 pointer-events-none"></div>
                        </div>
                    </div>
                </div>
            );
        }

                                        setHasSWUpdate(true);
                                    }
                                };
                            }
                        };
                    }).catch(err => {
                        console.log('SW registration note:', err.message);
                    });

                    let refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {

                    });

                // Trigger Service Worker background check if supported
                if ('serviceWorker' in navigator && swRegistration) {
                    swRegistration.update().catch(e => console.log('SW update check:', e.message));
                }

                try {
                    const res = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) throw new Error('version.json fetch failed');
                    const serverData = await res.json();

                    const serverBuild = parseInt(serverData.buildNumber || '0', 10);
                    const serverVersion = serverData.installedVersion || '1.0.0';

                    let localBuildStr = localStorage.getItem('amir_installed_build');
                    let localVersion = localStorage.getItem('amir_installed_version');

                    if (!localBuildStr) {
                        localStorage.setItem('amir_installed_build', serverBuild.toString());
                        localStorage.setItem('amir_installed_version', serverVersion);
                        localBuildStr = serverBuild.toString();
                        localVersion = serverVersion;
                    }

                    const localBuild = parseInt(localBuildStr, 10);
                    const isUpdateAvailable = (serverBuild > localBuild) || hasSWUpdate;

                    setVersionData({
                        ...serverData,
                        installedVersion: localVersion || serverVersion,
                        buildNumber: localBuild,
                        latestVersion: serverVersion,
                        latestBuild: serverBuild,
                        isUpdateAvailable: isUpdateAvailable
                    });

                    if (isManual) {
                        setIsCheckingUpdate(false);

                            showToast('شما از آخرین نسخه استفاده می‌کنید');

                        if (hasSWUpdate) {
                            showToast('یک نسخه جدیدتر آماده بروزرسانی است');

                if (!contactId) return 0;
                const directPeriods = completedPeriods.filter(p => p.contactId === contactId && p.type === type);
                const archivedTxs = transactions.filter(t => t.contactId === contactId && t.periodId && (
                    (type === 'debt' && (t.type === 'debt' || t.type === 'debt_repayment')) ||
                    (type === 'demand' && (t.type === 'demand' || t.type === 'demand_repayment'))
                ));
                const pIds = new Set();
                directPeriods.forEach(p => pIds.add(p.id));
                archivedTxs.forEach(t => pIds.add(t.periodId));
                return pIds.size;
            };

                    const principal = (loan.principalAmount || '').toString();
                    const repayment = (loan.totalRepayment || '').toString();
                    const installment = (loan.installmentAmount || '').toString();
                    const note = (loan.notes || loan.note || loan.description || '').toLowerCase();

                    const matchDirect = title.includes(accountsQuery) ||
                        contactName.includes(accountsQuery) ||
                        principal.includes(accountsQuery) ||
                        repayment.includes(accountsQuery) ||
                        installment.includes(accountsQuery) ||
                        note.includes(accountsQuery);

                    if (matchDirect) return true;

                    return transactions.some(t => t.loanId === loan.id && (
                        (t.note || '').toLowerCase().includes(accountsQuery) ||
                        (t.description || '').toLowerCase().includes(accountsQuery) ||
                        (t.amount || '').toString().includes(accountsQuery) ||
                        (t.dateStr || '').includes(accountsQuery)

                        const info = getLoanNextDueInfo(loan, transactions);
                        return !info.isCompleted && (loan.remainingAmount === undefined || loan.remainingAmount > 0);
                    });
                }

                return list.sort((a, b) => {
                    const aCompleted = (getLoanNextDueInfo(a, transactions).isCompleted || (a.remainingAmount !== undefined && a.remainingAmount <= 0)) ? 1 : 0;
                    const bCompleted = (getLoanNextDueInfo(b, transactions).isCompleted || (b.remainingAmount !== undefined && b.remainingAmount <= 0)) ? 1 : 0;

                    }

                    if (txToDelete.contactId) {
                        const contactDebts = updatedTxs.filter(t => t.contactId === txToDelete.contactId && (t.type === 'debt' || t.type === 'debt_repayment') && !t.periodId);
                        let netDebt = 0;
                        contactDebts.forEach(t => {
                            if (t.type === 'debt') netDebt += Math.abs(t.amount);
                            if (t.type === 'debt_repayment') netDebt -= Math.abs(t.amount);
                        });
                        netDebt = Math.max(0, netDebt);

                        const updatedContacts = contacts.map(c => {
                            if (c.id === txToDelete.contactId) {
                                return { ...c, totalDebt: netDebt };
                            }
                            return c;
                        });
                        setContacts(updatedContacts);
                        if (selectedContact && selectedContact.id === txToDelete.contactId) {
                            setSelectedContact(prev => ({ ...prev, totalDebt: netDebt }));
                        }
                    }
                    showToast('تراکنش بدهی با موفقیت حذف گردید');

                    const updatedTxs = transactions.filter(t => t.id !== txToDelete.id);

                                const updatedTotalAmt = updatedPeriodTxs.reduce((sum, t) => (t.type === 'demand' ? sum + Math.abs(t.amount) : sum), 0);

            const exportPeriodAsPNG = (period) => {
                if (!period) return;
                try {
                    const isDebt = period.type === 'debt';
                    const txs = period.transactions || [];

                    const canvas = document.createElement('canvas');
                    const width = 800;
                    const rowHeight = 44;
                    const headerHeight = 220;
                    const tableHeaderHeight = 42;
                    const footerHeight = 60;
                    const height = headerHeight + tableHeaderHeight + Math.max(1, txs.length) * rowHeight + footerHeight;

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);

                    ctx.fillStyle = isDebt ? '#e11d48' : '#059669';
                    ctx.fillRect(0, 0, width, 12);

                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 22px Tahoma, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(`صورت‌حساب دوره تسویه‌شده ${isDebt ? 'قرض / بدهی' : 'طلب'}`, width - 35, 52);

                    ctx.fillStyle = '#64748b';
                    ctx.font = '13px Tahoma, sans-serif';
                    ctx.fillText(`نام مخاطب: ${period.contactName || ''}    •    بازه زمانی: از ${formatDateToNumericJalali(period.startDate)} تا ${formatDateToNumericJalali(period.endDate)}`, width - 35, 78);

                    ctx.fillStyle = isDebt ? '#fff1f2' : '#ecfdf5';
                    drawRoundRect(ctx, 35, 96, width - 70, 100, 14);
                    ctx.fill();
                    ctx.strokeStyle = isDebt ? '#fecdd3' : '#a7f3d0';
                    ctx.stroke();

                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 16px Tahoma, sans-serif';
                    ctx.fillText(`مبلغ کل دوره: ${Number(period.totalAmount || 0).toLocaleString()} تومان`, width - 60, 132);

                    ctx.fillStyle = isDebt ? '#be123c' : '#047857';
                    ctx.font = 'bold 14px Tahoma, sans-serif';
                    ctx.fillText(`وضعیت: تسویه‌شده و کامل (مانده: ۰ تومان)`, width - 60, 168);

                    const tableTop = 216;
                    ctx.fillStyle = isDebt ? '#e11d48' : '#059669';
                    ctx.fillRect(35, tableTop, width - 70, 38);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Tahoma, sans-serif';
                    ctx.fillText('ردیف', width - 60, tableTop + 24);
                    ctx.fillText('شرح / عنوان تراکنش', width - 140, tableTop + 24);
                    ctx.fillText('تاریخ', width - 420, tableTop + 24);
                    ctx.fillText('مبلغ (تومان)', width - 620, tableTop + 24);

                    let currentY = tableTop + 38;
                    if (txs.length === 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(35, currentY, width - 70, 44);
                        ctx.fillStyle = '#94a3b8';
                        ctx.font = '13px Tahoma, sans-serif';
                        ctx.fillText('هیچ تراکنشی در این دوره ثبت نشده است', width / 2 + 80, currentY + 28);
                        currentY += 44;
                    } else {
                        txs.forEach((tx, idx) => {
                            ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                            ctx.fillRect(35, currentY, width - 70, rowHeight);

                            ctx.strokeStyle = '#f1f5f9';
                            ctx.strokeRect(35, currentY, width - 70, rowHeight);

                            ctx.fillStyle = '#334155';
                            ctx.font = '12px Tahoma, sans-serif';
                            ctx.fillText(String(idx + 1), width - 60, currentY + 26);
                            ctx.fillText(tx.title || 'تراکنش', width - 140, currentY + 26);
                            ctx.fillText(formatDateToNumericJalali(tx.dateStr), width - 420, currentY + 26);

                            const isRepay = tx.type === 'debt_repayment' || tx.type === 'demand_repayment';
                            ctx.fillStyle = isRepay ? '#16a34a' : '#e11d48';
                            ctx.font = 'bold 12px Tahoma, sans-serif';
                            ctx.fillText(Number(Math.abs(tx.amount) || 0).toLocaleString(), width - 620, currentY + 26);

                            currentY += rowHeight;
                        });
                    }

                    const nowJalali = getDeviceJalaliDate();
                    const periodDateStr = formatDateToNumericJalali(`${nowJalali.day} ${nowJalali.month} ${nowJalali.year}`);
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '11px Tahoma, sans-serif';
                    ctx.fillText(`تاریخ صدور: ${periodDateStr}    •    برنامه مدیریت مالی شخصی`, width - 35, currentY + 32);

                    const imageURI = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `خروجی_تسویه_${isDebt ? 'بدهی' : 'طلب'}_${(period.contactName || '').replace(/\s+/g, '_')}.png`;
                    link.href = imageURI;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (err) {
                    console.error("Export Period PNG error:", err);
                }

                    const targetLoan = editLoanId ? (loans.find(l => l.id === Number(editLoanId)) || activeTargetLoan) : null;
                    const editAmt = isEditTx ? Math.abs(data.amount || 0) : (targetLoan ? targetLoan.installmentAmount : '');

                    }

                        return;

                        const inputAmt = Number(installmentForm.amount) || 0;
                        if (inputAmt <= 0) {

                        }

                            const loanPaid = transactions.filter(t => t.loanId === targetLoan.id && t.type === 'repayment').reduce((sum, t) => sum + Math.abs(t.amount || 0), 0);
                            const loanTotal = (targetLoan.totalRepayment > 0) ? targetLoan.totalRepayment : targetLoan.principalAmount;
                            const loanRemaining = Math.max(0, loanTotal - loanPaid);
                            if (inputAmt > loanRemaining) {

                        <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl border border-slate-100 dark:border-slate-700 text-center animate-scale-up">
                                <div className="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950/80 text-red-600 dark:text-red-400 mx-auto flex items-center justify-center">
                                    <Icon name="trash-2" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h4 className="text-sm font-bold text-slate-900 dark:text-white">حذف پرونده وام</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">
                                        آیا از حذف پرونده وام «{selectedLoan?.title}» اطمینان دارید؟ کلیه اقساط ثبت‌شده برای این وام نیز پاک خواهند شد.
                                    </p>
                                </div>
                                <div className="flex space-x-2 space-x-reverse pt-1">
                                    <button 
                                        onClick={confirmDeleteLoan}
                                        className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-95">
                                        بله، حذف شود
                                    </button>
                                    <button 
                                        onClick={() => setShowDeleteLoanModal(false)}
                                        className="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-all active:scale-95">
                                        خیر، انصراف
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Confirm Database Restore */}
                    {showRestoreConfirmModal && (
                        <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl border border-slate-100 dark:border-slate-700 text-center animate-scale-up">
                                <div className="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 mx-auto flex items-center justify-center">
                                    <Icon name="upload-cloud" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h4 className="text-sm font-bold text-slate-900 dark:text-white">بازیابی اطلاعات</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">
                                        آیا از بازیابی فایل پشتیبان اطمینان دارید؟ تمامی اطلاعات فعلی با اطلاعات فایل پشتیبان جایگزین خواهند شد.
                                    </p>
                                </div>
                                <div className="flex space-x-2 space-x-reverse pt-1">
                                    <button 
                                        onClick={handleConfirmRestoreData}
                                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-95">
                                        تأیید و بازیابی
                                    </button>
                                    <button 
                                        onClick={() => { setShowRestoreConfirmModal(false); setPendingRestoreData(null); }}
                                        className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-all active:scale-95">
                                        انصراف
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Confirm Delete All Data */}
                    {showResetConfirmModal && (
                        <div className="absolute inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-xs rounded-3xl p-5 space-y-4 shadow-2xl border border-slate-100 dark:border-slate-700 text-center animate-scale-up">
                                <div className="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-400 mx-auto flex items-center justify-center">
                                    <Icon name="alert-triangle" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h4 className="text-sm font-bold text-slate-900 dark:text-white">حذف کلیه اطلاعات</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">
                                        آیا از پاکسازی کامل دیتابیس اطمینان دارید؟ تمام مخاطبین، وام‌ها، طلب‌ها، بدهی‌ها و تراکنش‌ها به صورت دائمی حذف خواهند شد.
                                    </p>
                                </div>
                                <div className="flex space-x-2 space-x-reverse pt-1">
                                    <button 
                                        onClick={handleConfirmDeleteAllData}
                                        className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-95">
                                        حذف کامل
                                    </button>
                                    <button 
                                        onClick={() => setShowResetConfirmModal(false)}
                                        className="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-all active:scale-95">
                                        انصراف
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

        /* Card Stack Animation Styles */
        .card-stack-container {
            height: 385px;
            max-height: 385px;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            position: relative;
            perspective: 1400px;
            perspective-origin: 50% 35%;
            transform-style: preserve-3d;
        }

        .stack-card {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease, box-shadow 0.6s ease;
            transform-origin: center bottom;
            will-change: transform, opacity, z-index;
        }

        /* Position 0: Active top card */
        .stack-card[data-depth="0"] {
            transform: translate3d(0, 0px, 0px) scale(1);
            z-index: 100;
            opacity: 1;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.35), 0 0 1px rgba(0, 0, 0, 0.1);
        }

        @keyframes ios-shake {
            0%, 100% { transform: translate3d(0, 0px, 0px) scale(1); }
            15% { transform: translate3d(-7px, 0px, 0px) scale(1); }
            30% { transform: translate3d(7px, 0px, 0px) scale(1); }
            45% { transform: translate3d(-5px, 0px, 0px) scale(1); }
            60% { transform: translate3d(5px, 0px, 0px) scale(1); }
            75% { transform: translate3d(-3px, 0px, 0px) scale(1); }
            90% { transform: translate3d(3px, 0px, 0px) scale(1); }
        }
        .animate-shake {
            animation: ios-shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
        }

        /* Position 1: Second card stacked behind */
        .stack-card[data-depth="1"] {
            transform: translate3d(0, 10px, -20px) scale(0.965);
            z-index: 50;
            opacity: 0.95;
            pointer-events: none;
            box-shadow: 0 15px 30px -10px rgba(15, 23, 42, 0.25);
        }

        /* Position 2: Third card stacked deep behind */
        .stack-card[data-depth="2"] {
            transform: translate3d(0, 20px, -40px) scale(0.93);
            z-index: 20;
            opacity: 0.85;
            pointer-events: none;
            box-shadow: 0 10px 20px -8px rgba(15, 23, 42, 0.2);
        }

        /* Hidden cards further back */
        .stack-card[data-depth="hidden"] {
            transform: translate3d(0, 30px, -60px) scale(0.88);
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Apple-Grade Fall Down & Shrink Exit / Rewind Animations */
        @keyframes cardFallDownNext {
            0% {
                transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            30% {
                transform: translate3d(8px, -15px, 0) scale(1.02) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: translate3d(-15px, 300px, 0) scale(0.75) rotate(-6deg);
                opacity: 0;
            }
        }

        .card-exit-to-back, .animating-next {
            animation: cardFallDownNext 0.85s cubic-bezier(0.25, 0.1, 0.25, 1) forwards !important;
            z-index: 150 !important;
            pointer-events: none !important;
            will-change: transform, opacity !important;
            transform-origin: top center;
        }

        .card-enter-from-back, .animating-prev {
            animation: cardFallDownNext 0.75s cubic-bezier(0.25, 0.1, 0.25, 1) reverse forwards !important;
            z-index: 200 !important;
            pointer-events: none !important;
            will-change: transform, opacity !important;
            transform-origin: top center;
        }

        /* Apple Spring Open / Close keyframes for stack modal */
        @keyframes appleSpringOpen {
            0% {
                opacity: 0;
                transform: scale(0.82) translateY(30px);
                filter: blur(4px);
            }
            70% {
                transform: scale(1.04) translateY(-6px);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes appleSpringClose {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            30% {
                transform: scale(1.03) translateY(-3px);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateY(35px);
                filter: blur(4px);
            }
        }

        /* کلیدهای انیمیشن iOS Spring/Bounce ضمیمه‌شده */
        @keyframes stackFallSubmit {
            0% {
                transform: translate3d(0, 0, 0) scale(1) rotateX(0deg);
                opacity: 1;
            }
            25% {
                transform: translate3d(0, -14px, 0) scale(1.02) rotateX(-2deg);
                opacity: 1;
            }
            100% {
                transform: translate3d(0, 240px, 0) scale(0.78) rotateX(-15deg);
                opacity: 0;
            }
        }

        .card-stack-fall-submit {
            animation: stackFallSubmit 0.48s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards !important;
            pointer-events: none !important;
        }

        @keyframes iosPopIn {
            0% {
                opacity: 0;
                transform: scale(0.75);
            }
            65% {
                opacity: 1;
                transform: scale(1.05);
            }
            85% {
                transform: scale(0.97);
            }

                transform: scale(1);

        @keyframes iosPopOut {

            100% {

        /* iOS Edge Swipe Back Viewport and Page Styles */
        .app-viewport {
